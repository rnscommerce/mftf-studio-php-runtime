name: php-windows-spike
# Throwaway: a Windows PHP for MFTF Studio assembled from the official zip.
on:
  pull_request:
    paths:
      - .github/workflows/php-windows-spike.yml
env:
  PHP: '8.3'
  XDEBUG: '3.5.3'
  MFTF: mftf-6.0.1-1
jobs:
  assemble:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: PHP from windows.php.net
        run: |
          curl -fsSL https://windows.php.net/downloads/releases/releases.json -o releases.json
          node -e '
            const r = require("./releases.json")[process.env.PHP];
            const k = Object.keys(r).find((k) => k.startsWith("nts-") && k.endsWith("-x64"));
            console.log(r.version, k, r[k].zip.path, r[k].zip.sha256);
            require("fs").writeFileSync("php.env", `VERSION=${r.version}\nZIP=${r[k].zip.path}\nSHA=${r[k].zip.sha256}\nVS=${k.split("-")[1]}\n`);
          '
          source php.env
          curl -fsSL "https://windows.php.net/downloads/releases/$ZIP" -o php.zip
          echo "$SHA  php.zip" | sha256sum -c -
          mkdir runtime && cd runtime && 7z x -y ../php.zip > /dev/null && ls
          echo "VS=$VS" >> "$GITHUB_ENV"
      - name: Xdebug and igbinary DLLs
        run: |
          cd runtime
          curl -fsSL "https://xdebug.org/files/php_xdebug-$XDEBUG-$PHP-nts-$VS-x86_64.dll" -o ext/php_xdebug.dll
          base=https://downloads.php.net/~windows/pecl/releases/igbinary
          v="$(curl -fsSL $base/ | grep -oE 'href="[0-9][0-9.]*/' | tr -d '"' | sed 's/href=//; s#/##' | sort -V | tail -1)"
          echo "igbinary $v"
          curl -fsSL "$base/$v/php_igbinary-$v-$PHP-nts-$VS-x64.zip" -o ../igbinary.zip
          7z e -y ../igbinary.zip php_igbinary.dll -oext > /dev/null
          ls ext | grep -E 'xdebug|igbinary'
      - name: php.ini and Composer
        run: |
          cd runtime
          cat > php.ini <<'INI'
          memory_limit=-1
          extension_dir=ext
          extension=bz2
          extension=curl
          extension=fileinfo
          extension=gd
          extension=intl
          extension=mbstring
          extension=openssl
          extension=pdo_sqlite
          extension=sockets
          extension=sodium
          extension=sqlite3
          extension=zip
          extension=igbinary
          zend_extension=opcache
          zend_extension=xdebug
          xdebug.mode=off
          INI
          curl -fsSL https://getcomposer.org/download/2.10.2/composer.phar -o composer.phar
          printf '@echo off\r\n"%%~dp0php.exe" "%%~dp0composer.phar" %%*\r\n' > composer.bat
      - name: Extensions
        run: |
          cd runtime
          export PHPRC="$PWD"
          ./php.exe -v
          loaded="$(./php.exe -r 'echo strtolower(implode(",", get_loaded_extensions()));')"
          for ext in bcmath bz2 ctype curl dom fileinfo filter gd iconv igbinary intl mbstring "zend opcache" openssl pdo pdo_sqlite phar session simplexml sockets sodium sqlite3 tokenizer xml zip zlib xdebug; do
            [[ ",$loaded," == *",$ext,"* ]] && echo "ok       $ext" || echo "MISSING  $ext"
          done
          ./php.exe --ri xdebug | head -5
          ./composer.bat --version
      - name: MFTF answers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export PHPRC="$PWD/runtime"
          mkdir mftf && cd mftf
          gh release download "$MFTF" -R rnscommerce/mftf-distros -p '*.tgz'
          tar xzf *.tgz
          "$PHPRC/php.exe" 6.0.1/bin/mftf --version
      - name: Size
        run: du -sh runtime; du -sh runtime/* | sort -h | tail -6
      - name: Without the Visual C++ runtime
        run: |
          # What a bare machine lacks: PHP's own DLL dependencies.
          cd runtime
          ls *.dll | head -20
          ls /c/Windows/System32/vcruntime140.dll /c/Windows/System32/vcruntime140_1.dll /c/Windows/System32/msvcp140.dll
