name: php
# PHP CLIs for MFTF Studio to carry, built with static-php-cli, each with
# Xdebug beside it. A pull request that changes this file builds them; running
# the workflow on main publishes each as a release named php-<version>-<BUILD>.
#
# Built against glibc rather than musl: Xdebug can only be a shared extension,
# and a fully static PHP cannot load one. The build runs in CentOS 7, so the
# binary needs no glibc newer than 2.17.
on:
  pull_request:
    paths:
      - .github/workflows/php.yml
  workflow_dispatch:
env:
  BUILD: '2'
  SPC: '2.8.5'
  XDEBUG: '3.5.3'
  EXTENSIONS: bcmath,bz2,ctype,curl,dom,fileinfo,filter,gd,iconv,igbinary,intl,mbregex,mbstring,opcache,openssl,pcntl,pdo,pdo_sqlite,phar,posix,session,simplexml,sockets,sodium,sqlite3,tokenizer,xml,zip,zlib
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          repository: crazywhalecc/static-php-cli
          ref: ${{ env.SPC }}
      - name: Download sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./bin/spc-gnu-docker download --with-php=${{ matrix.php }} --for-extensions="$EXTENSIONS,xdebug" --custom-url="xdebug:https://github.com/xdebug/xdebug/archive/refs/tags/$XDEBUG.tar.gz" --prefer-pre-built --retry=3
      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./bin/spc-gnu-docker build "$EXTENSIONS" --build-shared=xdebug --build-cli
      - name: Check
        run: |
          php=buildroot/bin/php
          "$php" -v
          "$php" -r 'exit(str_starts_with(PHP_VERSION, $argv[1] . ".") ? 0 : 1);' "${{ matrix.php }}"
          loaded="$("$php" -r 'echo strtolower(implode(",", get_loaded_extensions()));')"
          for ext in ${EXTENSIONS//,/ }; do
            case "$ext" in
              mbregex) "$php" -r 'exit(function_exists("mb_ereg") ? 0 : 1);' ;;
              opcache) [[ ",$loaded," == *",zend opcache,"* ]] ;;
              *) [[ ",$loaded," == *",$ext,"* ]] ;;
            esac || { echo "missing $ext"; exit 1; }
          done
          ldd "$php" buildroot/modules/xdebug.so
          "$php" -d zend_extension="$PWD/buildroot/modules/xdebug.so" --ri xdebug
          "$php" -d zend_extension="$PWD/buildroot/modules/xdebug.so" -r 'exit(phpversion("xdebug") === $argv[1] ? 0 : 1);' "$XDEBUG"
          newest="$(objdump -T "$php" buildroot/modules/xdebug.so | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
          echo "newest glibc symbol: $newest"
          [[ "$(printf '%s\n' "$newest" GLIBC_2.17 | sort -V | tail -1)" == GLIBC_2.17 ]]
          echo "RELEASE=php-$("$php" -r 'echo PHP_VERSION;')-$BUILD" >> "$GITHUB_ENV"
      - name: Package
        run: |
          mkdir php
          cp buildroot/bin/php php/php
          cp buildroot/modules/xdebug.so php/xdebug.so
          cp -r buildroot/license php/license
          tar czf "$RELEASE-linux-x86_64.tar.gz" -C php .
          sha256sum "$RELEASE-linux-x86_64.tar.gz" > "$RELEASE-linux-x86_64.tar.gz.sha256"
          cat "$RELEASE-linux-x86_64.tar.gz.sha256"
      - name: Release
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$RELEASE" \
            --notes "PHP CLI for linux x86_64, needs glibc 2.17 or newer, NTS, built with static-php-cli $SPC. Extensions: $EXTENSIONS. Xdebug $XDEBUG beside it as xdebug.so, loaded with -d zend_extension. Licences of PHP, its extensions and the libraries linked in are in license/." \
            "$RELEASE-linux-x86_64.tar.gz" "$RELEASE-linux-x86_64.tar.gz.sha256"
